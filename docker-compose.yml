# AEGIS AI - Sovereign AI Workbench : PostgreSQL
#
# Single-node, loopback-only database for the air-gapped deployment.
# The backend connects to 127.0.0.1:5432 as user `aegis`.
#
#   docker compose up -d          start
#   docker compose ps             status
#   docker compose logs -f db     logs
#   docker compose down           stop (data is kept in the named volume)
#   docker compose down -v        stop and DELETE all data
#
# No host port is published beyond loopback, and no egress is required: the image
# is pulled once, after which the container runs fully offline.

services:
  db:
    image: postgres:17-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: sih_sovereign_ai
      # Deterministic collation so ORDER BY is reproducible across hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Bound to loopback only: this database is never exposed to the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - aegis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d sih_sovereign_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command:
      - "postgres"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "log_min_duration_statement=2000"

volumes:
  aegis_pgdata:
    name: aegis_pgdata
